/* ============================== HELPERS ============================== */
const rndInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const rndFloat = (min, max) => Math.random() * (max - min) + min;
const pctAmount = ([min, max], base) => Math.round((rndFloat(min, max) / 100) * base);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const choice = (arr) => arr[rndInt(0, arr.length - 1)];

  rrruu: { id: "rrruu", name: "Rrruu", pack: "Default-Paket", category: "heal", dialogue: "rrrruuu rrrrruuuu", type: "healDmgSplit", total: 35, desc: "Unberechenbar - heilt dich und schadet der Rivalin, Aufteilung zufällig." },
  miau: { id: "miau", name: "Miau", pack: "Default-Paket", category: "damage", dialogue: "miau miau miauuu", type: "dmgHealSplit", total: 35, desc: "Unberechenbar - schadet der Rivalin und heilt dich, Aufteilung zufällig." },

  team_maskulin: { id: "team_maskulin", name: "Team Maskulin", pack: "Trash-Paket", category: "damage", dialogue: "weil ich der maskuline Mann bin. Und du hast drauf geschissen!", type: "damageSelfSplash", dmg: [20, 20], selfDmg: [10, 10], desc: "Hoher Schaden, aber riskant für dich selbst." },
  schmetterlinge: { id: "schmetterlinge", name: "Schmetterlinge", pack: "Trash-Paket", category: "heal", dialogue: "du bist die Königin der Schmetterlinge", type: "healBoth", heal: [20, 20], enemyHeal: [5, 5], desc: "Heilt dich kräftig - aus Versehen auch etwas die Rivalin." },
  labil: { id: "labil", name: "Labil", pack: "Trash-Paket", category: "damage", dialogue: "du bist labil. Du. Bist. Labil.", type: "damageSelfHeal", dmg: [15, 15], heal: [5, 5], desc: "Schadet der Rivalin und heilt dich ein wenig." },
  nudelsalat: { id: "nudelsalat", name: "Nudelsalat", pack: "Trash-Paket", category: "heal", dialogue: "hör nicht auf andere. Das macht dir nur Nudelsalat im Kopf.", type: "healEnemyDmg", heal: [10, 10], dmg: [5, 5], desc: "Heilt dich vor allem, schadet der Rivalin ein wenig." },
};
const ARG_IDS = Object.keys(ARGS);

function resolveArg(def, casterMax, targetMax) {
  switch (def.type) {
    case "damage":
      return { dmgToTarget: pctAmount(def.dmg, targetMax) };
    case "damageSelfSplash":
      return { dmgToTarget: pctAmount(def.dmg, targetMax), dmgToSelf: pctAmount(def.selfDmg, casterMax) };
    case "heal":
      return { healToSelf: pctAmount(def.heal, casterMax) };
    case "healDmgSplit": {
      const healRoll = rndFloat(1, def.total);
      const dmgRoll = def.total - healRoll;
      return { healToSelf: Math.round((healRoll / 100) * casterMax), dmgToTarget: Math.round((dmgRoll / 100) * targetMax) };
    }
    case "dmgHealSplit": {
      const dmgRoll = rndFloat(1, def.total);
      const healRoll = def.total - dmgRoll;
      return { dmgToTarget: Math.round((dmgRoll / 100) * targetMax), healToSelf: Math.round((healRoll / 100) * casterMax) };
    }
    case "healBoth":
      return { healToSelf: pctAmount(def.heal, casterMax), healToTarget: pctAmount(def.enemyHeal, targetMax) };
    case "damageSelfHeal":
      return { dmgToTarget: pctAmount(def.dmg, targetMax), healToSelf: pctAmount(def.heal, casterMax) };
    case "healEnemyDmg":
      return { healToSelf: pctAmount(def.heal, casterMax), dmgToTarget: pctAmount(def.dmg, targetMax) };
    default:
      return {};
  }
}

function pickRandomArgId(category, exclude = []) {
  const pool = ARG_IDS.filter((id) => ARGS[id].category === category && !exclude.includes(id));
  return choice(pool.length ? pool : ARG_IDS);
}

  pigeon: { id: "pigeon", name: "Pigeon", pack: "DB-Gestalten-Paket", sprite: "pigeon", rivalArgs: { mode: "fixed", args: ["rrruu"] }, ally: { type: "flatBoost", amount: 5, label: "+5% auf Heilung und Schaden" }, blurb: "Eine Taube. Sehr Taube. Ganz schön Taube." },
};
const CHAR_IDS = Object.keys(CHARS);

function buildRivalArgs(mode) {
  switch (mode.mode) {
    case "fixed":
      return [...mode.args];
    case "fixedPlusRandom": {
      const extra = [];
      for (let i = 0; i < mode.randomCount; i++) extra.push(pickRandomArgId(mode.randomCategory, [...mode.fixed, ...extra]));
      return [...mode.fixed, ...extra];
    }
    case "random": {
      const picks = [];
      for (let i = 0; i < mode.count; i++) picks.push(pickRandomArgId(mode.category, picks));
      return picks;
    }
    case "oneEachRandom":
      return [pickRandomArgId("damage"), pickRandomArgId("heal")];
    default:
      return [pickRandomArgId("damage"), pickRandomArgId("heal")];
  }
}

function buildEnemy(playerMaxHp) {
  const charId = choice(CHAR_IDS);
  const c = CHARS[charId];
  const maxHp = rndInt(Math.round(playerMaxHp * 0.3), Math.round(playerMaxHp * 0.75));
  return { charId, name: c.name, maxHp, hp: maxHp, argIds: buildRivalArgs(c.rivalArgs) };
}

function pickEnemyArg(enemy) {
  const healArgs = enemy.argIds.filter((id) => ARGS[id].category === "heal");
  if (enemy.hp / enemy.maxHp < 0.5 && healArgs.length && Math.random() < 0.75) return choice(healArgs);
  return choice(enemy.argIds);
}

/* ============================== BATTLE ENGINE ============================== */
function playRound(battle, playerArgId, equippedCharId) {
  const events = [];
  let enemy = { ...battle.enemy };
  let playerHp = battle.playerHp;
  const playerMaxHp = battle.playerMaxHp;
  const ally = equippedCharId ? CHARS[equippedCharId].ally : null;

  if (ally && ally.type === "roundStartDmgEnemy") {
    const dmg = pctAmount([ally.min, ally.max], enemy.maxHp);
    enemy.hp = clamp(enemy.hp - dmg, 0, enemy.maxHp);
    events.push({ speaker: CHARS[equippedCharId].name, text: "feuert Anni an und motzt " + enemy.name + " an!", delta: enemy.name + " -" + dmg, side: "ally" });
  } else if (ally && ally.type === "roundStartHealPlayer") {
    const heal = pctAmount([ally.min, ally.max], playerMaxHp);
    playerHp = clamp(playerHp + heal, 0, playerMaxHp);
    events.push({ speaker: CHARS[equippedCharId].name, text: "feuert Anni an!", delta: "Anni +" + heal, side: "ally" });
  }

  if (enemy.hp <= 0 || playerHp <= 0) {
    return { events, playerHp, enemy, finished: true, winner: enemy.hp <= 0 ? "player" : "enemy", round: battle.round + 1 };
  }

  const playerFirst = Math.random() < 0.5;
  const enemyArgId = pickEnemyArg(enemy);
  let actions = [
    { actor: "player", argId: playerArgId },
    { actor: "enemy", argId: enemyArgId },
  ];
  if (!playerFirst) actions.reverse();

  for (const act of actions) {
    if (enemy.hp <= 0 || playerHp <= 0) break;
    const isPlayer = act.actor === "player";
    const def = ARGS[act.argId];
    const casterMax = isPlayer ? playerMaxHp : enemy.maxHp;
    const targetMax = isPlayer ? enemy.maxHp : playerMaxHp;
    let { dmgToTarget = 0, dmgToSelf = 0, healToSelf = 0, healToTarget = 0 } = resolveArg(def, casterMax, targetMax);

    if (isPlayer && ally) {
      if (ally.type === "healBoost") healToSelf = Math.round(healToSelf * ally.mult);
      if (ally.type === "dmgBoost") dmgToTarget = Math.round(dmgToTarget * ally.mult);
      if (ally.type === "flatBoost") {
        if (dmgToTarget > 0) dmgToTarget += Math.round((ally.amount / 100) * targetMax);
        if (healToSelf > 0) healToSelf += Math.round((ally.amount / 100) * casterMax);
      }
    }

    if (isPlayer) {
      enemy.hp = clamp(enemy.hp - dmgToTarget, 0, enemy.maxHp);
      playerHp = clamp(playerHp - dmgToSelf, 0, playerMaxHp);
      playerHp = clamp(playerHp + healToSelf, 0, playerMaxHp);
      enemy.hp = clamp(enemy.hp + healToTarget, 0, enemy.maxHp);
    } else {
      playerHp = clamp(playerHp - dmgToTarget, 0, playerMaxHp);
      enemy.hp = clamp(enemy.hp - dmgToSelf, 0, enemy.maxHp);
      enemy.hp = clamp(enemy.hp + healToSelf, 0, enemy.maxHp);
      playerHp = clamp(playerHp + healToTarget, 0, playerMaxHp);
    }

    const targetLabel = isPlayer ? enemy.name : "Anni";
    const casterLabel = isPlayer ? "Anni" : enemy.name;
    const parts = [];
    if (dmgToTarget > 0) parts.push(targetLabel + " -" + dmgToTarget);
    if (dmgToSelf > 0) parts.push(casterLabel + " -" + dmgToSelf);
    if (healToSelf > 0) parts.push(casterLabel + " +" + healToSelf);
    if (healToTarget > 0) parts.push(targetLabel + " +" + healToTarget);
    events.push({ speaker: casterLabel, text: def.dialogue, delta: parts.join(", "), side: isPlayer ? "player" : "enemy" });
  }

  const finished = enemy.hp <= 0 || playerHp <= 0;
  const winner = finished ? (enemy.hp <= 0 ? "player" : "enemy") : null;
  return { events, playerHp, enemy, finished, winner, round: battle.round + 1 };
}

/* ============================== PIXEL ART ============================== */
const U = 6; // pixel unit size
const GRID = 16;
function blk(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x * U, y * U, w * U, h * U);
}

function humanoid(ctx, { skin, hair, hairStyle, outfit, pants, wide = false }) {
  const w1 = wide ? 2 : 3;
  blk(ctx, 4, 12, 8, 4, pants);
  blk(ctx, w1, 8, 16 - 2 * w1, 5, outfit);
  blk(ctx, 6, 7, 4, 1, skin);
  blk(ctx, 4, 2, 8, 6, skin);
  blk(ctx, 6, 5, 1, 1, "#1a1a1a");
  blk(ctx, 9, 5, 1, 1, "#1a1a1a");
  if (hairStyle === "curly") {
    blk(ctx, 3, 1, 2, 2, hair);
    blk(ctx, 5, 0, 2, 2, hair);
    blk(ctx, 7, 0, 2, 2, hair);
    blk(ctx, 9, 0, 2, 2, hair);
    blk(ctx, 11, 1, 2, 2, hair);
    blk(ctx, 3, 3, 1, 2, hair);
    blk(ctx, 12, 3, 1, 2, hair);
  } else if (hairStyle === "buzz") {
    blk(ctx, 4, 1, 8, 2, hair);
  } else if (hairStyle === "rasta") {
    blk(ctx, 4, 1, 8, 2, hair);
    blk(ctx, 2, 2, 2, 9, hair);
    blk(ctx, 4, 2, 1, 9, hair);
    blk(ctx, 12, 2, 2, 9, hair);
  } else if (hairStyle === "short") {
    blk(ctx, 3, 1, 10, 3, hair);
    blk(ctx, 3, 3, 1, 3, hair);
    blk(ctx, 12, 3, 1, 3, hair);
  } else if (hairStyle === "beanie") {
    blk(ctx, 3, 1, 10, 3, hair);
  }
}

function PixelCanvas({ draw, size = 96 }) {
  const ref = useRef(null);
  useEffect(() => {
    const ctx = ref.current.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, GRID * U, GRID * U);
    draw(ctx);
  }, [draw]);
  return <canvas ref={ref} width={GRID * U} height={GRID * U} style={{ width: size, height: size, imageRendering: "pixelated" }} />;
}

function HealthBar({ value, max, color = C.pink }) {

}

  return <PixelCanvas draw={draw} size={size} />;
}
function ArgIcon({ id, size = 48 }) {

/* ============================== SAVE STATE ============================== */
function freshSave() {
  const dmgId = pickRandomArgId("damage");
  const healId = pickRandomArgId("heal");
  return {
    wisdom: 0,
    health: 100,
    ownedArgs: [dmgId, healId],
    ownedChars: [],
    equippedArgs: [dmgId, healId, null],
    equippedChar: null,
    streak: 0,
  };
}

/* ============================== MAIN APP ============================== */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [save, setSave] = useState(null);
  const [screen, setScreen] = useState("menu");
  const [battle, setBattle] = useState(null);
  const [battleResult, setBattleResult] = useState(null); // {type:'win'|'lose', ...}
  const [gachaResult, setGachaResult] = useState(null);
  const [equipPicker, setEquipPicker] = useState(null); // {kind:'char'|'arg', slot}
  const [gameOverPicks, setGameOverPicks] = useState({ char: null, arg: null });
  const logEndRef = useRef(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("anni-save");
      if (raw) setSave(JSON.parse(raw));
      else setSave(freshSave());
    } catch (e) {
      setSave(freshSave());
    }
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded || !save) return;
    try {
      localStorage.setItem("anni-save", JSON.stringify(save));
    } catch (e) {}
  }, [save, loaded]);

  useEffect(() => {
    if (logEndRef.current) logEndRef.current.scrollTop = 0;
  }, [battle?.log?.length]);

  if (!loaded || !save) {
    return (
      <div style={{ ...shellStyle, alignItems: "center", justifyContent: "center", display: "flex" }}>
        <div style={{ fontFamily: "'Press Start 2P'", color: C.paper, fontSize: 12 }}>LÄDT ...</div>
      </div>
    );
  }

  const startBattle = () => {
    const enemy = buildEnemy(100);
    setBattle({
      enemy,
      playerHp: save.health,
      playerMaxHp: 100,
      round: 1,
      log: [{ speaker: "Erzähler", text: "Du triffst auf " + enemy.name + ".", delta: "Bereite deine Argumente vor!", side: "narrator" }],
      finished: false,
    });
    setBattleResult(null);
    setScreen("battle");
  };

  const useArgument = (argId) => {
    if (!battle || battle.finished) return;
    const result = playRound(battle, argId, save.equippedChar);
    const newLog = [...result.events.slice().reverse(), ...battle.log];
    const newBattle = { ...battle, enemy: result.enemy, playerHp: result.playerHp, round: result.round, log: newLog, finished: result.finished };
    setBattle(newBattle);

    if (result.finished) {
      if (result.winner === "player") {
        const wisdomGain = rndInt(25, 75) + 5 * (result.round - 1);
        let healPct = rndInt(5, 15);
        const allyDef = save.equippedChar ? CHARS[save.equippedChar].ally : null;
        if (allyDef && allyDef.type === "roundStartHealPlayer") healPct += rndFloat(allyDef.min, allyDef.max);
        const newHealth = clamp(result.playerHp + Math.round((healPct / 100) * 100), 0, 100);
        setSave((s) => ({ ...s, wisdom: s.wisdom + wisdomGain, health: newHealth, streak: s.streak + 1 }));
        setBattleResult({ type: "win", wisdomGain, healPct: Math.round(healPct) });
      } else {
        setSave((s) => ({ ...s, health: 0 }));
        setGameOverPicks({ char: save.equippedChar, arg: save.equippedArgs.find(Boolean) || null });
        setBattleResult({ type: "lose", survived: save.streak });
      }
    }
  };

  const restartAfterLoss = () => {
    setSave((s) => ({
      ...s,
      health: 100,
      streak: 0,
      equippedChar: gameOverPicks.char,
      equippedArgs: [gameOverPicks.arg, null, null],
    }));
    setBattle(null);
    setBattleResult(null);
    setScreen("menu");
  };

  const doGacha = (kind) => {
    const cost = kind === "arg" ? 25 : 45;
    if (save.wisdom < cost) return;
    if (kind === "arg") {
      const id = choice(ARG_IDS);
      const owned = save.ownedArgs.includes(id);
      if (owned) {
        setSave((s) => ({ ...s, wisdom: s.wisdom - cost + 15 }));
        setGachaResult({ kind: "arg", id, duplicate: true, refund: 15 });
      } else {
        setSave((s) => ({ ...s, wisdom: s.wisdom - cost, ownedArgs: [...s.ownedArgs, id] }));
        setGachaResult({ kind: "arg", id, duplicate: false });
      }
    } else {
      const id = choice(CHAR_IDS);
      const owned = save.ownedChars.includes(id);
      if (owned) {
        setSave((s) => ({ ...s, wisdom: s.wisdom - cost + 35, health: clamp(s.health + Math.round(0.05 * 100), 0, 100) }));
        setGachaResult({ kind: "char", id, duplicate: true, refund: 35 });
      } else {
        setSave((s) => ({ ...s, wisdom: s.wisdom - cost, ownedChars: [...s.ownedChars, id] }));
        setGachaResult({ kind: "char", id, duplicate: false });
      }
    }
  };

  const equipArgToSlot = (argId, slot) => {
    setSave((s) => {
      const next = [...s.equippedArgs];
      // remove existing occurrence of this arg elsewhere
      for (let i = 0; i < next.length; i++) if (next[i] === argId) next[i] = null;
      next[slot] = argId;
      return { ...s, equippedArgs: next };
    });
    setEquipPicker(null);
  };
  const clearArgSlot = (slot) => {
    setSave((s) => {
      const next = [...s.equippedArgs];
      next[slot] = null;
      return { ...s, equippedArgs: next };
    });
  };
  const equipChar = (charId) => {
    setSave((s) => ({ ...s, equippedChar: charId }));
    setEquipPicker(null);
  };
  const clearChar = () => setSave((s) => ({ ...s, equippedChar: null }));

  return (
    <div style={shellStyle}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
        * { box-sizing: border-box; }
        button { font-family: 'VT323', monospace; cursor: pointer; }
        @keyframes popIn { from { opacity:0; transform: translateY(-6px) scale(.97);} to {opacity:1; transform: translateY(0) scale(1);} }
        .pop { animation: popIn .25s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: ${C.pink}; border-radius: 3px; }
      `}</style>

      <TopBar wisdom={save.wisdom} health={save.health} />

      <div style={{ flex: 1, overflowY: "auto", padding: "10px 12px 8px" }}>
        {screen === "menu" && <MenuScreen save={save} onStart={startBattle} />}
        {screen === "battle" && battle && (
          <BattleScreen
            battle={battle}
            save={save}
            onUse={useArgument}
            result={battleResult}
            logEndRef={logEndRef}
            onNext={() => { setBattleResult(null); startBattle(); }}
            onBackMenu={() => { setBattle(null); setBattleResult(null); setScreen("menu"); }}
          />
        )}
        {screen === "gacha" && <GachaScreen save={save} onPull={doGacha} />}
        {screen === "profile" && (
          <ProfileScreen
            save={save}
            onOpenPicker={setEquipPicker}
            onClearArg={clearArgSlot}
            onClearChar={clearChar}
          />
        )}
      </div>

      <BottomNav screen={screen} setScreen={(s) => { if (s !== "battle") { setScreen(s); } }} inBattle={!!battle && !battleResult} />

      {gachaResult && <GachaModal result={gachaResult} onClose={() => setGachaResult(null)} />}
      {equipPicker && (
        <EquipModal
          picker={equipPicker}
          save={save}
          onClose={() => setEquipPicker(null)}
          onPickArg={equipArgToSlot}
          onPickChar={equipChar}
        />
      )}
      {battleResult && battleResult.type === "lose" && (
        <GameOverModal
          survived={battleResult.survived}
          save={save}
          picks={gameOverPicks}
          setPicks={setGameOverPicks}
          onRestart={restartAfterLoss}
        />
      )}
    </div>
  );
}

}
function Empty({ text }) {
  return <div style={{ color: "#999", fontSize: 14 }}>{text}</div>;
}
function CollectionRow({ id, isChar, equipped, equippedSlot, onEquip }) {
  const def = isChar ? CHARS[id] : ARGS[id];
  const isEquipped = isChar ? equipped : equippedSlot > -1;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderTop: "1px solid #d8cdb8" }}>
      {isChar ? <Pixel id={id} size={36} /> : <ArgIcon id={id} size={32} />}
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 15, fontWeight: "bold" }}>{def.name}</div>
        <div style={{ fontSize: 12, color: "#777" }}>{def.pack}</div>
      </div>
      {isChar ? (
        <button onClick={() => onEquip()} style={{ ...miniBtn, background: equipped ? C.teal : C.paper2, color: equipped ? "#fff" : C.ink }}>
          {equipped ? <IconCheck size={14} /> : "Ausr."}
        </button>
      ) : (
        <div style={{ display: "flex", gap: 3 }}>
          {[0, 1, 2].map((slot) => (
            <button key={slot} onClick={() => onEquip(slot)} style={{ ...miniBtn, width: 24, background: equippedSlot === slot ? C.teal : C.paper2, color: equippedSlot === slot ? "#fff" : C.ink }}>
              {slot + 1}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}
const miniBtn = { border: "2px solid " + C.ink, borderRadius: 3, padding: "3px 8px", fontSize: 13 };

/* ============================== MODALS ============================== */
function Overlay({ children, onClose }) {
  return (
    <div
      onClick={onClose}
      style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 20 }}
    >
      <div onClick={(e) => e.stopPropagation()}>{children}</div>
    </div>
  );
}

function EquipModal({ picker, save, onClose, onPickArg, onPickChar }) {
  const isChar = picker.kind === "char";
  const ids = isChar ? save.ownedChars : save.ownedArgs;
  return (
    <Overlay onClose={onClose}>
      <Flyer tilt={0} style={{ width: 280, maxHeight: "70vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
          <div style={{ fontWeight: "bold" }}>{isChar ? "Begleiter wählen" : "Argument für Slot " + (picker.slot + 1)}</div>
          <button onClick={onClose}><IconX size={16} /></button>
        </div>
        {ids.length === 0 && <Empty text={isChar ? "Noch keine Verbündeten." : "Noch keine Argumente."} />}
        {ids.map((id) => {
          const def = isChar ? CHARS[id] : ARGS[id];
          return (
            <button
              key={id}
              onClick={() => (isChar ? onPickChar(id) : onPickArg(id, picker.slot))}
              style={{ width: "100%", display: "flex", alignItems: "center", gap: 8, padding: "6px 4px", border: "none", borderTop: "1px solid #d8cdb8", background: "transparent", textAlign: "left" }}
            >
              {isChar ? <Pixel id={id} size={34} /> : <ArgIcon id={id} size={30} />}
              <div>
                <div style={{ fontSize: 15, fontWeight: "bold" }}>{def.name}</div>
                <div style={{ fontSize: 12, color: "#777" }}>{isChar ? def.ally.label : def.desc}</div>
              </div>
              <IconChevron size={14} style={{ marginLeft: "auto" }} />
            </button>
          );
        })}
      </Flyer>
    </Overlay>
  );
}

function GameOverModal({ survived, save, picks, setPicks, onRestart }) {
  return (
    <Overlay>
      <Flyer tilt={0} style={{ width: 280, textAlign: "center" }}>
        <div style={{ fontFamily: "'Press Start 2P'", fontSize: 13, color: C.red }}>DISKUSSION VERLOREN</div>
        <div style={{ marginTop: 8, fontSize: 18 }}>Du hast <b>{survived}</b> Diskussion{survived === 1 ? "" : "en"} überstanden.</div>
        <div style={{ marginTop: 12, fontSize: 14, color: "#555" }}>Wähle, womit du neu startest:</div>

        <div style={{ marginTop: 8, textAlign: "left" }}>
          <div style={{ fontSize: 13, color: "#777" }}>Begleiter</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
            <button onClick={() => setPicks((p) => ({ ...p, char: null }))} style={{ ...miniBtn, background: picks.char === null ? C.teal : C.paper2 }}>ohne</button>
            {save.ownedChars.map((id) => (
              <button key={id} onClick={() => setPicks((p) => ({ ...p, char: id }))} style={{ ...miniBtn, background: picks.char === id ? C.teal : C.paper2 }}>
                {CHARS[id].name}
              </button>
            ))}
          </div>
        </div>

        <div style={{ marginTop: 10, textAlign: "left" }}>
          <div style={{ fontSize: 13, color: "#777" }}>Argument</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 4 }}>
            {save.ownedArgs.map((id) => (
              <button key={id} onClick={() => setPicks((p) => ({ ...p, arg: id }))} style={{ ...miniBtn, background: picks.arg === id ? C.teal : C.paper2 }}>
                {ARGS[id].name}
              </button>
            ))}
          </div>
        </div>

        <button onClick={onRestart} style={{ ...navBtnStyle, marginTop: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
          <IconRotate size={16} /> Neustart
        </button>
      </Flyer>
    </Overlay>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
